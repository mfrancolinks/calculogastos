<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis gastos</title>
<style>
:root{--bg:#f6f5f1;--cd:#fff;--tx:#1d1d1b;--mu:#6b6a64;--bd:#e2e0d8;--ac:#0f6e56;--ax:#fff;--dg:#b3261e;--wa:#b7791f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#161614;--cd:#222220;--tx:#efeee9;--mu:#a3a199;--bd:#37362f;--ac:#3fbf9b;--ax:#0b1f19;--dg:#f2877f;--wa:#e0a640}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#161614;--cd:#222220;--tx:#efeee9;--mu:#a3a199;--bd:#37362f;--ac:#3fbf9b;--ax:#0b1f19;--dg:#f2877f;--wa:#e0a640}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:780px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}
.top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
nav button.on{background:var(--ac);color:var(--ax);border-color:var(--ac)}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
input,select,button.b{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
button.b{cursor:pointer}button.p{background:var(--ac);color:var(--ax);border-color:var(--ac)}button.x{color:var(--dg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{min-width:0}
.mu{color:var(--mu);font-size:13px}.r{text-align:right}.tot{font-weight:600}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}
td,th{padding:4px;text-align:left;vertical-align:middle;font-size:14px}th{color:var(--mu);font-weight:500;font-size:12px}
td input,td select{width:100%}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.chip{display:inline-block;padding:4px 10px;border:1px solid var(--bd);border-radius:20px;margin:0 6px 6px 0;font-size:13px}
.st{padding:10px;border-radius:8px;background:var(--bg);margin-bottom:12px}
.bar{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:3px 0 10px}.bar i{display:block;height:100%}
.cols{display:flex;align-items:flex-end;gap:8px;height:120px}.cols div{flex:1;text-align:center;font-size:11px;color:var(--mu)}
.cols b{display:block;background:var(--ac);border-radius:4px 4px 0 0;margin-bottom:3px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script></head><body><main>
<div class="top"><h1>Mis gastos</h1><span class="mu" id="sync"></span></div>
<nav id="nav"></nav><div id="v"></div>
</main>
<script>
const KEY="gastos-v2";
const COL=["#0f6e56","#2b6cb0","#b7791f","#9b2c6b","#c05621","#5a67d8","#718096","#c53030"];
let S={cats:[{id:"c1",name:"Alimentación",color:COL[0],budget:0},{id:"c2",name:"Transporte",color:COL[1],budget:0},{id:"c3",name:"Hogar",color:COL[2],budget:0},{id:"c4",name:"Otros",color:COL[6],budget:0}],exps:[],iva:16,cur:"Local",fx:1};
try{const r=localStorage.getItem(KEY)||localStorage.getItem("gastos-v1");if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const today=()=>ymd(new Date());
let tab="scan",D=null,status="",cloud="local",col=null,migrated=false,F={m:"",c:"",sm:today().slice(0,7)};
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const n2=n=>(+n||0).toLocaleString("es",{minimumFractionDigits:2,maximumFractionDigits:2});
const U=n=>"US$ "+n2(n),L=n=>S.cur+" "+n2(n),uid=()=>Math.random().toString(36).slice(2,9);
const cat=id=>S.cats.find(c=>c.id===id)||{name:"Sin categoría",color:"#888",budget:0};
const opts=sel=>S.cats.map(c=>`<option value="${c.id}" ${c.id===sel?"selected":""}>${esc(c.name)}</option>`).join("");
const line=(it,incl)=>{const t=incl?it.q*it.p:it.q*it.p*(1+S.iva/100);return{tot:t,sub:t/(1+S.iva/100)}};
const usd=(i,e)=>i.tot/(e.fx||1);

/* ---------- Guardado (local + nube) ---------- */
const lsave=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const bad=()=>{cloud="err";sync()};
const wSet=()=>{lsave();col&&col.doc("settings").set({cats:S.cats,iva:S.iva,cur:S.cur,fx:S.fx}).catch(bad)};
const wExp=e=>{lsave();col&&col.doc("e_"+e.id).set({store:e.store,date:e.date,fx:e.fx,iva:e.iva,items:e.items}).catch(bad)};
const wDel=id=>{lsave();col&&col.doc("e_"+id).delete().catch(bad)};
function sync(){$("#sync").textContent=cloud==="err"?"⚠ No se pudo guardar":"Guardado en este dispositivo"}

function nav(){$("#nav").innerHTML=[["scan","Nueva"],["log","Registro"],["sum","Resumen"],["set","Ajustes"]].map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}
function go(t){tab=t;draw()}
function draw(){nav();sync();({scan:vScan,log:vLog,sum:vSum,set:vSet})[tab]()}

/* ---------- Nueva factura ---------- */
function vScan(){
 let h=`<div class="card"><h2>1. Foto de la factura</h2>
 <div class="row"><input type="file" accept="image/*" capture="environment" onchange="scan(this.files[0])">
 <button class="b" onclick="manual()">o ingresar manualmente</button></div>
 <div class="mu" style="margin-top:6px">Se detectan los ítems y se les suma el ${S.iva}% de IVA. Podrás revisar todo antes de guardar.</div></div>${status?`<div class="st">${status}</div>`:""}`;
 if(D){
  const T=D.items.reduce((a,i)=>{const l=line(i,D.incl);a.t+=l.tot;a.s+=l.sub;return a},{t:0,s:0});
  h+=`<div class="card"><h2>2. Revisar y guardar</h2>
  <div class="row" style="margin-bottom:8px"><input placeholder="Comercio" value="${esc(D.store)}" onchange="D.store=this.value">
  <input type="date" value="${esc(D.date)}" onchange="D.date=this.value">
  <label class="mu">Tasa del día (${esc(S.cur)} por US$1) <input type="number" step="any" style="width:90px" value="${D.fx}" onchange="D.fx=+this.value;draw()"></label></div>
  <label class="mu"><input type="checkbox" ${D.incl?"checked":""} onchange="D.incl=this.checked;draw()"> Los precios de la factura ya incluyen IVA (no sumar)</label>
  <div class="scroll" style="margin-top:8px"><table><tr><th>Descripción</th><th style="width:56px">Cant.</th><th style="width:90px">Precio unit.</th><th style="width:130px">Categoría</th><th class="r" style="width:100px">Total c/IVA</th><th style="width:30px"></th></tr>
  ${D.items.map((i,n)=>`<tr><td><input value="${esc(i.d)}" onchange="D.items[${n}].d=this.value"></td>
  <td><input type="number" step="any" value="${i.q}" onchange="D.items[${n}].q=+this.value;draw()"></td>
  <td><input type="number" step="any" value="${i.p}" onchange="D.items[${n}].p=+this.value;draw()"></td>
  <td><select onchange="D.items[${n}].c=this.value">${opts(i.c)}</select></td>
  <td class="r">${n2(line(i,D.incl).tot)}<div class="mu">${D.fx>0?U(line(i,D.incl).tot/D.fx):""}</div></td><td><button class="b x" onclick="D.items.splice(${n},1);draw()">✕</button></td></tr>`).join("")}</table></div>
  <div class="row" style="margin-top:8px"><button class="b" onclick="D.items.push({d:'',q:1,p:0,c:S.cats[0]?.id});draw()">+ Ítem</button><span style="flex:1"></span>
  <div class="r"><div class="mu">Subtotal ${L(T.s)} · IVA ${L(T.t-T.s)}</div><div class="tot">Total ${L(T.t)}</div><div class="tot" style="color:var(--ac)">${D.fx>0?U(T.t/D.fx):"Indica la tasa del día"}</div></div></div>
  <div class="row" style="margin-top:10px"><button class="b p" onclick="saveExp()">Guardar en el registro</button><button class="b" onclick="D=null;status='';draw()">Descartar</button></div></div>`;
 }
 $("#v").innerHTML=h;
}
function manual(){D={store:"",date:today(),incl:false,fx:S.fx,items:[{d:"",q:1,p:0,c:S.cats[0]?.id}]};status="";draw()}
async function shrink(file){const b=await createImageBitmap(file),s=Math.min(1,2200/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*s);c.height=Math.round(b.height*s);c.getContext("2d").drawImage(b,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",.85))}
const num=s=>{s=s.replace(/[^\d.,]/g,"");const a=s.lastIndexOf("."),b=s.lastIndexOf(",");
 if(a>-1&&b>-1){const d=Math.max(a,b);return +(s.slice(0,d).replace(/[.,]/g,"")+"."+s.slice(d+1))}
 const m=s.match(/[.,](\d{2})$/);if(m)return +(s.slice(0,-3).replace(/[.,]/g,"")+"."+m[1]);return +s.replace(/[.,]/g,"")};
function parseOCR(t){
 const SK=/total|subtotal|sub-total|iva|i\.v\.a|impuesto|cambio|efectivo|tarjeta|descuento|propina|tax|cash|change|visa|master|base imp|igtf|pago|recibido|saldo|vuelto|art[ií]culos/i;
 const lines=t.split(/\n/).map(l=>l.trim()).filter(Boolean);
 const store=(lines.find(l=>(l.match(/[A-Za-zÁ-úñÑ]/g)||[]).length>=3)||"").slice(0,50);
 let date="";const dm=t.match(/\b(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4}|\d{2})\b/),iso=t.match(/\b\d{4}-\d{2}-\d{2}\b/);
 if(iso)date=iso[0];else if(dm&&+dm[1]<=31&&+dm[2]<=12){let y=dm[3];if(y.length==2)y="20"+y;date=`${y}-${dm[2].padStart(2,"0")}-${dm[1].padStart(2,"0")}`}
 const items=[];
 for(const l of lines){
  if(SK.test(l))continue;
  const am=l.match(/(\d[\d.,]*[.,]\d{2})\D{0,4}$/);if(!am)continue;
  const tot=num(am[1]);if(!(tot>0))continue;
  let d=l.slice(0,am.index).trim(),q=1;
  d=d.replace(/(\s+[xX*]?\s*\d[\d.,]*[.,]\d{2})+\s*$/,"");
  const qm=d.match(/^(\d+(?:[.,]\d+)?)\s*[xX*]\s*/)||d.match(/^(\d{1,3})\s+(?=[A-Za-zÁ-ú])/);
  if(qm){q=num(qm[1])||1;d=d.slice(qm[0].length)}
  d=d.replace(/[\s.\-_:|]+$/,"").replace(/\s{2,}/g," ");
  if((d.match(/[A-Za-zÁ-ú]/g)||[]).length<2)continue;
  items.push({d,q,p:+(tot/q).toFixed(4)})
 }
 return{store,date,items}
}
async function scan(file){
 if(!file)return;
 status="Cargando el lector de texto (la primera vez tarda un poco)…";draw();
 try{
  if(!window.Tesseract)throw new Error("no se pudo cargar el lector; revisa tu conexión a internet");
  let last=-1;
  const r=await Tesseract.recognize(await shrink(file),"spa",{logger:m=>{if(m.status==="recognizing text"){const p=Math.round(m.progress*10);if(p!==last){last=p;status="Leyendo la factura… "+p*10+"%";draw()}}}});
  const o=parseOCR(r.data.text);
  D={store:o.store,date:o.date||today(),incl:false,fx:S.fx,items:o.items.map(i=>({...i,c:S.cats[0]?.id}))};
  if(!D.items.length)D.items.push({d:"",q:1,p:0,c:S.cats[0]?.id});
  status=o.items.length?"Listo. La lectura automática puede tener errores: revisa cada ítem, precio y cantidad.":"No se pudieron detectar ítems. Prueba con una foto más nítida o agrégalos manualmente.";
 }catch(e){status="No se pudo leer la imagen ("+esc(e.message||e)+"). Puedes ingresar los ítems manualmente."}
 draw();
}
function dl(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function backup(){dl("gastos-respaldo-"+today()+".json",JSON.stringify(S),"application/json")}
function restore(f){if(!f)return;f.text().then(t=>{try{const x=JSON.parse(t);if(!Array.isArray(x.exps)||!Array.isArray(x.cats))throw 0;if(!confirm("Esto reemplazará los datos actuales. ¿Continuar?"))return;S=Object.assign(S,x);lsave();status="Respaldo restaurado ✓";go("log")}catch(e){alert("El archivo no es un respaldo válido.")}})}
function saveExp(){
 if(!(D.fx>0)){status="Indica la tasa de cambio del día para calcular el total en dólares.";return draw()}
 const items=D.items.filter(i=>i.d||i.p).map(i=>{const l=line(i,D.incl);return{d:i.d,q:i.q,sub:l.sub,tot:l.tot,c:i.c}});
 if(!items.length)return;
 const e={id:uid(),store:D.store,date:D.date,fx:D.fx,iva:S.iva,items};
 S.exps.unshift(e);S.fx=D.fx;wExp(e);wSet();D=null;status="Guardado en el registro ✓";go("log");
}

/* ---------- Registro (en dólares) ---------- */
function vLog(){
 const months=[...new Set(S.exps.map(e=>e.date.slice(0,7)))].sort().reverse();
 const ex=S.exps.filter(e=>!F.m||e.date.startsWith(F.m));
 const tc={};let all=0,allL=0;
 ex.forEach(e=>e.items.forEach(i=>{if(!F.c||i.c===F.c){tc[i.c]=(tc[i.c]||0)+usd(i,e);all+=usd(i,e);allL+=i.tot}}));
 let h=(status?`<div class="st">${status}</div>`:"")+`<div class="card"><div class="row"><select onchange="F.m=this.value;draw()"><option value="">Todos los meses</option>${months.map(m=>`<option ${m===F.m?"selected":""}>${m}</option>`).join("")}</select>
 <select onchange="F.c=this.value;draw()"><option value="">Todas las categorías</option>${opts(F.c)}</select><span style="flex:1"></span><button class="b" onclick="csv()">Exportar CSV</button></div>
 <div style="margin-top:10px">${Object.entries(tc).map(([c,v])=>`<span class="chip"><span class="dot" style="background:${cat(c).color}"></span>${esc(cat(c).name)}: ${U(v)}</span>`).join("")}</div>
 <div class="tot">Total: ${U(all)} <span class="mu">(${L(allL)})</span></div></div>`;
 if(!ex.length)h+=`<div class="card mu">Aún no hay gastos registrados.</div>`;
 ex.forEach(e=>{const its=e.items.filter(i=>!F.c||i.c===F.c);if(!its.length)return;
  h+=`<div class="card"><div class="row"><b>${esc(e.store||"Sin comercio")}</b><span class="mu">${esc(e.date)}</span><span style="flex:1"></span>
  <label class="mu">Tasa <input type="number" step="any" style="width:80px;padding:4px" value="${e.fx}" onchange="setFx('${e.id}',+this.value)"></label>
  <span class="tot">${U(e.items.reduce((a,i)=>a+usd(i,e),0))}</span><button class="b x" onclick="delExp('${e.id}')">Eliminar</button></div>
  <div class="scroll"><table>${its.map(i=>{const n=e.items.indexOf(i);return`<tr><td>${esc(i.d)}</td><td class="mu" style="width:50px">×${i.q}</td><td style="width:150px"><select onchange="setCat('${e.id}',${n},this.value)">${opts(i.c)}</select></td><td class="r" style="width:110px">${U(usd(i,e))}<div class="mu">${L(i.tot)}</div></td></tr>`}).join("")}</table></div></div>`});
 $("#v").innerHTML=h;status="";
}
const ex1=id=>S.exps.find(e=>e.id===id);
function setCat(id,n,c){const e=ex1(id);e.items[n].c=c;wExp(e);draw()}
function setFx(id,v){if(!(v>0))return draw();const e=ex1(id);e.fx=v;wExp(e);draw()}
function delExp(id){if(confirm("¿Eliminar esta factura del registro?")){S.exps=S.exps.filter(e=>e.id!==id);wDel(id);draw()}}
async function csv(){
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[["Fecha","Comercio","Descripción","Cantidad","Subtotal "+S.cur,"Total "+S.cur+" con IVA","Tasa","Total USD","Categoría"]];
 S.exps.forEach(e=>e.items.forEach(i=>rows.push([e.date,e.store,i.d,i.q,i.sub.toFixed(2),i.tot.toFixed(2),e.fx,usd(i,e).toFixed(2),cat(i.c).name])));
 dl("gastos.csv","\ufeff"+rows.map(r=>r.map(q).join(",")).join("\n"),"text/csv;charset=utf-8")
}

/* ---------- Resumen: gráficos y presupuestos ---------- */
function vSum(){
 const m=F.sm,by={};let tot=0;
 const months=[...new Set(S.exps.map(e=>e.date.slice(0,7)).concat(today().slice(0,7)))].sort().reverse();
 S.exps.filter(e=>e.date.startsWith(m)).forEach(e=>e.items.forEach(i=>{const v=usd(i,e);by[i.c]=(by[i.c]||0)+v;tot+=v}));
 const C=2*Math.PI*40;let off=0;
 const segs=Object.entries(by).filter(([,v])=>v>0).map(([c,v])=>{const l=v/tot*C,s=`<circle r="40" cx="60" cy="60" fill="none" stroke="${cat(c).color}" stroke-width="22" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}"/>`;off+=l;return s}).join("");
 const ids=[...new Set([...Object.keys(by),...S.cats.filter(c=>c.budget>0).map(c=>c.id)])];
 const tb=S.cats.reduce((a,c)=>a+(+c.budget||0),0);
 const ms=[];for(let k=5;k>=0;k--){const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);ms.push(ymd(d).slice(0,7))}
 const mt=ms.map(x=>S.exps.filter(e=>e.date.startsWith(x)).reduce((a,e)=>a+e.items.reduce((b,i)=>b+usd(i,e),0),0)),mx=Math.max(...mt,1);
 $("#v").innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Mes</h2><select onchange="F.sm=this.value;draw()">${months.map(x=>`<option ${x===m?"selected":""}>${x}</option>`).join("")}</select></div>
 <div class="row" style="margin-top:12px;gap:18px">${tot>0?`<svg viewBox="0 0 120 120" width="150" height="150" style="transform:rotate(-90deg);flex:none">${segs}</svg>`:`<span class="mu">Sin gastos este mes.</span>`}
 <div style="flex:1;min-width:160px"><div class="tot" style="font-size:18px">${U(tot)}</div>${tb>0?`<div class="mu">de ${U(tb)} presupuestados</div>`:`<div class="mu">Define presupuestos en Ajustes.</div>`}
 ${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="mu"><span class="dot" style="background:${cat(c).color}"></span>${esc(cat(c).name)} ${Math.round(v/tot*100)}%</div>`).join("")}</div></div></div>
 <div class="card"><h2>Presupuesto vs. gasto</h2>${ids.length?ids.map(id=>{const c=cat(id),sp=by[id]||0,b=+c.budget||0,p=b?sp/b*100:0,cl=p>=100?"var(--dg)":p>=80?"var(--wa)":c.color;
  return`<div class="row"><b>${esc(c.name)}</b><span style="flex:1"></span><span class="mu">${U(sp)}${b?" / "+U(b):" · sin presupuesto"}${p>=100?" · excedido":""}</span></div><div class="bar"><i style="width:${b?Math.min(100,p):0}%;background:${cl}"></i></div>`}).join(""):`<div class="mu">Nada que mostrar todavía.</div>`}</div>
 <div class="card"><h2>Últimos 6 meses (US$)</h2><div class="cols">${mt.map((v,k)=>`<div><span>${Math.round(v)}</span><b style="height:${Math.max(2,v/mx*80)}px"></b>${ms[k].slice(2)}</div>`).join("")}</div></div>`;
}

/* ---------- Ajustes ---------- */
function vSet(){
 $("#v").innerHTML=`<div class="card"><h2>Categorías y presupuesto mensual (US$)</h2>
 ${S.cats.map((c,n)=>`<div class="row" style="margin-bottom:8px"><input type="color" value="${c.color}" style="width:44px;padding:2px" onchange="S.cats[${n}].color=this.value;wSet()">
 <input value="${esc(c.name)}" style="flex:1" onchange="S.cats[${n}].name=this.value;wSet()"><input type="number" step="any" min="0" placeholder="Presup." value="${c.budget||""}" style="width:100px" onchange="S.cats[${n}].budget=+this.value||0;wSet()"><button class="b x" onclick="delCat(${n})">✕</button></div>`).join("")}
 <div class="row"><input id="nc" placeholder="Nueva categoría" style="flex:1"><button class="b p" onclick="addCat()">Agregar</button></div></div>
 <div class="card"><h2>IVA y moneda</h2><div class="row"><label class="mu">IVA % <input type="number" step="any" value="${S.iva}" style="width:80px" onchange="S.iva=+this.value||0;wSet()"></label>
 <label class="mu">Moneda local <input value="${esc(S.cur)}" style="width:90px" onchange="S.cur=this.value.trim()||'Local';wSet();draw()"></label>
 <label class="mu">Tasa por defecto (${esc(S.cur)} por US$1) <input type="number" step="any" value="${S.fx}" style="width:100px" onchange="S.fx=+this.value||1;wSet()"></label></div>
 <div class="mu" style="margin-top:6px">Cada factura guarda la tasa con la que se registró, así los totales en dólares no cambian si la tasa varía después. También puedes corregirla factura por factura en el Registro.</div></div>
 <div class="card"><h2>Respaldo de datos</h2><div class="mu" style="margin-bottom:8px">Tus datos viven solo en este navegador. Descarga un respaldo de vez en cuando; también sirve para pasarlos a otro dispositivo.</div>
 <div class="row"><button class="b p" onclick="backup()">Descargar respaldo</button><label class="b">Restaurar respaldo <input type="file" accept=".json,application/json" style="display:none" onchange="restore(this.files[0]);this.value=''"></label></div></div>`;
}
function addCat(){const v=$("#nc").value.trim();if(!v)return;S.cats.push({id:uid(),name:v,color:COL[S.cats.length%COL.length],budget:0});wSet();draw()}
function delCat(n){const c=S.cats[n],used=S.exps.some(e=>e.items.some(i=>i.c===c.id));if(used&&!confirm("Hay gastos con esta categoría; quedarán «Sin categoría». ¿Continuar?"))return;S.cats.splice(n,1);wSet();draw()}
draw();
</script></body></html>
